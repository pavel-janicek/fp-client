name: Android CI

on:
  # garmin/ is a Connect IQ project, not part of the Gradle build (see docs/GARMIN.md).
  push:
    paths-ignore:
      - 'garmin/**'
  pull_request:
    paths-ignore:
      - 'garmin/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Make Gradle executable
        run: chmod +x ./gradlew
      - name: Assemble debug APK
        run: ./gradlew assembleDebug
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest
      - name: Run lint
        run: ./gradlew lint
